<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudWar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #87b5d8;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      }
      canvas {
        display: block;
      }
      #start-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(#a5cfee, #7fb0d6);
        z-index: 10;
      }
      #start-screen .card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 20px;
        padding: 28px 32px;
        box-shadow: 0 12px 40px rgba(30, 58, 82, 0.25);
        text-align: center;
        width: 340px;
      }
      #start-screen h1 {
        margin: 0 0 4px;
        color: #1e3a52;
        font-size: 28px;
      }
      #start-screen .tagline {
        margin: 0 0 14px;
        color: #4a6b8a;
        font-size: 14px;
      }
      #style-preview {
        width: 280px;
        height: 180px;
        border-radius: 14px;
        background: linear-gradient(#b7d9f2, #8fbcdf);
        margin-bottom: 14px;
      }
      #start-screen label {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #1e3a52;
        font-size: 14px;
        margin: 8px 0;
      }
      #start-screen label span {
        width: 64px;
        text-align: left;
      }
      #start-screen input[type='range'] {
        flex: 1;
        accent-color: #3d7ab8;
      }
      #start-screen .buttons {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      #start-screen button {
        flex: 1;
        border: 0;
        border-radius: 12px;
        padding: 12px 0;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.08s ease;
      }
      #start-screen button:active {
        transform: scale(0.97);
      }
      #style-reroll {
        background: #e4eef7;
        color: #1e3a52;
      }
      #start-game {
        background: #3d7ab8;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="start-screen">
      <div class="card">
        <h1>☁️ CloudWar</h1>
        <p class="tagline">내 구름을 꾸며보세요</p>
        <canvas id="style-preview" width="280" height="180"></canvas>
        <label><span>봉우리</span><input id="style-lobes" type="range" min="3" max="8" step="1" value="5" /></label>
        <label><span>몽실함</span><input id="style-fluff" type="range" min="0.7" max="1.4" step="0.05" value="1" /></label>
        <div class="buttons">
          <button id="style-reroll" type="button">🎲 다시 뽑기</button>
          <button id="start-game" type="button">게임 시작</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
